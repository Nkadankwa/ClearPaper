spring.application.name=ClearPaper
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${SUPABASE_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/clearpaper?currentSchema=clearpaper}}
spring.datasource.username=${SUPABASE_DB_USER:${DB_USER:clearpaper}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/postgresql
spring.flyway.default-schema=clearpaper
spring.flyway.schemas=clearpaper
spring.sql.init.mode=never
clearpaper.supabase.url=${SUPABASE_URL}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
